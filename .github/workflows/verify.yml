name: verify

# ===========================================================================
# WHAT THIS PROVES
#
#   Job `analysis` -- runs anywhere, no services:
#       revision_stats.py, deployment_cost.py, sovereignty_sensitivity.py
#       regenerate the manuscript's ANALYSIS numbers from the committed run
#       data, and 16 assertions check every value still matches the paper.
#
#   Job `federation` -- starts PostgreSQL, MariaDB and PrestoDB 0.284, loads the
#       five public datasets, then executes all 50 gold queries through the
#       engine and requires each to satisfy its own validator. This covers the
#       DATA half: real cross-engine joins, not two independent reads.
#
# WHAT THIS DOES NOT PROVE -- stated so the badge is not over-read
#
#   It does NOT reproduce the manuscript's reported accuracies (60% / 74% / 90%).
#   Those came from HOSTED models called over HTTP:
#       google/gemma-3-27b-it:free
#       meta-llama/llama-3.3-70b-instruct:free
#       deepseek/deepseek-r1-0528:free
#   A free tier can change or vanish, so no amount of CI can pin them. That is a
#   limitation of the claim, not of this workflow.
#
#   It does NOT run a local LLM either. llama3.2:3b is a different model from
#   the ones the accuracies come from, so a green badge from it would prove the
#   harness works while implying something about the paper that is untrue.
#
#   It does NOT bring up the dashboard or the orchestration layer, which are not
#   on the path that produced any reported number.
#
# See REPRODUCIBILITY.md for the full account, including what was verified once
# on real hardware.
# ===========================================================================

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # ---------------------------------------------------------------- analysis
    analysis:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - name: Install toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends python3 python3-pip
                  python3 -m pip install --upgrade pip
                  # matplotlib renders fig_sensitivity.pdf; numpy comes with it.
                  # revision_stats.py deliberately avoids scipy.
                  python3 -m pip install 'matplotlib>=3.5' 'numpy>=1.21'

            - name: Record toolchain versions
              run: |
                  {
                    echo "### toolchain"
                    echo '```'
                    python3 --version
                    python3 -c 'import matplotlib, numpy; print("matplotlib", matplotlib.__version__); print("numpy", numpy.__version__)'
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check the cited run data is present
              run: |
                  f=datasets/benchmark_results_20260219_054729.json
                  test -s "$f" || { echo "$f is missing -- it is the input every analysis script reads"; exit 1; }
                  echo "present: $f ($(wc -c < "$f") bytes)"

            - name: Assert the scripts reproduce the published values
              run: python3 tools/assert_published_values.py

            - name: Check the sensitivity figure was produced
              run: |
                  python3 framework/sovereignty_sensitivity.py --out /tmp/figcheck
                  test -s /tmp/figcheck/fig_sensitivity.pdf || { echo "fig_sensitivity.pdf was not produced"; exit 1; }
                  echo "fig_sensitivity.pdf: $(wc -c < /tmp/figcheck/fig_sensitivity.pdf) bytes"

            - name: Check the tree is unchanged after the run
              run: |
                  # NOTE ':!__pycache__' is INVALID: git reads the leading underscore as
                  # pathspec magic and aborts. Glob the name instead.
                  files=$(git status --porcelain -- . \
                            ':!framework/fig_sensitivity.pdf' \
                            ':!*.png' ':!**/__pycache__/**' ':!*.pyc')
                  if [ -n "$files" ]; then
                    echo "files changed during the verification:"
                    echo "$files"
                    echo "A committed value was regenerated differently."
                    exit 1
                  fi
                  echo "tree unchanged: the committed run data reproduces the same values"

    # -------------------------------------------------------------- federation
    # The strongest deterministic check available: the whole data path, with no
    # model-version problem. PrestoDB 0.284 is the engine the patent names.
    #
    # The 371 MB of source tables are not in the tree. They are published as a
    # release asset, which Actions can fetch with the GITHUB_TOKEN it already
    # has -- so this needs no extra secret and no Kaggle account.
    federation:
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            # LFS objects must be materialised: actions/checkout defaults `lfs` to
            # false, and without it the working tree holds 134-byte pointers and the
            # loader finds no data.
            #
            # Which objects, though, matters for the owner's bandwidth meter. LFS
            # downloads are counted against the repository owner and reset monthly
            # (10 GiB on Free and Pro alike), and each full CI run pays for whatever
            # it fetches. `lfs: true` would pull EVERY tracked object:
            #   datasets/raw_tables/  371 MB   <- what this job loads
            #   datasets/sources/     500 MB   <- only for the from-source ETL path
            # so it would spend 871 MB a run where 371 MB does, and exhaust the
            # allowance in about 11 runs rather than 27. Pulling only what is needed
            # is therefore deliberate, not an optimisation.
            - uses: actions/checkout@v5
              with:
                  lfs: false

            - name: Fetch just the tables this job loads
              run: |
                  git lfs install --local
                  git lfs pull --include='datasets/raw_tables/**'
                  # Fail loudly here rather than with a confusing traceback later.
                  n=$(find datasets/raw_tables -name '*.csv' | wc -l)
                  echo "materialised $n CSV file(s) under datasets/raw_tables/"
                  test "$n" -ge 22 || { echo "expected at least 22 tables, got $n"; exit 1; }
                  # Detect un-smudged pointers by CONTENT, not size. Several tables
                  # are legitimately tiny -- hc_conditions.csv is 101 bytes and
                  # fin_fraud_classes.csv is 157 -- so they are shorter than the
                  # 134-byte pointer itself and a size test would either miss a real
                  # pointer or reject a real table. A pointer starts with this line.
                  pointers=$(grep -rl '^version https://git-lfs.github.com/spec/v1' \
                               datasets/raw_tables --include='*.csv' | wc -l)
                  test "$pointers" -eq 0 || { echo "$pointers file(s) are still LFS pointers"; exit 1; }
                  echo "no LFS pointers remain: every file is real content"

            - name: Install toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends python3 python3-pip curl
                  python3 -m pip install --upgrade pip
                  python3 -m pip install \
                    'psycopg2-binary>=2.9' 'mysql-connector-python>=8' 'requests>=2.28'

            - name: Start the federated stack
              run: |
                  docker compose up -d
                  # /v1/info answers 200 with "starting": true before the engine
                  # can serve queries, so wait on that flag, not the status code.
                  python3 tools/wait_for_engine.py
                  curl -fsS http://localhost:8080/v1/info | head -c 200; echo

            # Load from datasets/raw_tables/, which is tracked through Git LFS and
            # covers all five domains. Use real_infra_load.py: it carries explicit
            # typed DDL for all 22 tables, and the types are load-bearing. With every
            # column as TEXT, `avg()`, `sum()` and numeric comparisons fail with
            #   "Unexpected parameters (varchar) for function avg"
            # because the engine resolves function signatures by type. This is the
            # loader the reported measurements were taken with.
            - name: Load the five public datasets
              env:
                  # real_infra_load.py requires these explicitly (os.environ[...]).
                  POSTGRES_HOST: 127.0.0.1
                  POSTGRES_PORT: "5432"
                  POSTGRES_DB: framework_data
                  POSTGRES_USER: framework
                  POSTGRES_PASSWORD: framework
                  MARIADB_HOST: 127.0.0.1
                  MARIADB_PORT: "3306"
                  MARIADB_DB: bcdr_framework
                  MARIADB_USER: framework
                  MARIADB_PASSWORD: framework
              run: python3 framework/real_infra_load.py

            - name: Assert every gold query executes and validates
              run: python3 tools/verify_gold_queries.py

            - name: Summarise
              run: |
                  {
                    echo "### federation"
                    echo 'PrestoDB 0.284. All 50 gold queries executed and satisfied'
                    echo 'their own validators, including the cross-engine joins.'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Stack logs on failure
              if: failure()
              run: docker compose logs --tail=60
