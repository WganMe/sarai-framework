# Presto coordinator configuration.
#
# Single-node deployment: this process is both coordinator and worker, which is
# what the benchmark uses (the manuscript describes "coordinator mode").
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# The benchmark's Tier 5 queries UNION across all five domains, and the
# cross-engine joins pull several tables per query. The defaults are ample for
# the 50-question set, but leave headroom rather than tuning per query.
query.max-memory=2GB
query.max-memory-per-node=1GB
query.max-total-memory-per-node=1GB
