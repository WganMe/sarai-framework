# Node identity for the federation engine.
#
# `environment` is recorded here so every run states which deployment it is.
# The manuscript describes the original testbed as the SARAI environment; using
# the same token keeps /v1/info comparable between the archived deployment and a
# fresh reproduction.
#
# node.id is deliberately NOT set here. The image's entrypoint runs
#   echo "node.id=$HOSTNAME" >> $PRESTO_HOME/etc/node.properties
# so setting it here too would leave two node.id lines in the file. Java's
# Properties.load() keeps the last one, so it would still start, but the value
# would silently be the hostname rather than anything we chose.
node.environment=sarai
node.data-dir=/var/lib/presto/data
