# SARAI framework — federated query stack for reproduction.
#
# This brings up the DATA HALF of the study: the two source databases and the
# federation engine that joins them. It deliberately does NOT include the LLM or
# the dashboard, for the reasons stated in REPRODUCIBILITY.md.
#
#   docker compose up -d
#   ./reproduce.sh              # loads the data, then asserts 50/50 gold queries
#
# The engine is PrestoDB 0.284 — the product the patent names. CI uses the same
# image so a green badge means the same thing as a local run.
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework_data
    ports: ["5432:5432"]
    volumes:
      - ./datasets/raw_tables/postgresql:/docker-entrypoint-initdb.d/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framework -d framework_data"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bcdr_framework
      MARIADB_USER: framework
      MARIADB_PASSWORD: framework
    ports: ["3306:3306"]
    volumes:
      - ./datasets/raw_tables/mysql:/docker-entrypoint-initdb.d/raw:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Two connectors: `postgresql` (facts) and `mysql` (dimensions). These catalog
  # names are what every query in the benchmark uses, e.g.
  #   postgresql.public.olist_orders  JOIN  mysql.bcdr_framework.olist_customers
  presto:
    image: prestodb/presto:0.284
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb:  {condition: service_healthy}
    volumes:
      - ./framework/presto/catalog:/opt/presto/etc/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
