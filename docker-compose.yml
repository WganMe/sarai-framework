# SARAI framework — federated query stack for reproduction.
#
# This brings up the DATA HALF of the study: the two source databases and the
# federation engine that joins them. It deliberately does NOT include the LLM or
# the dashboard, for the reasons stated in REPRODUCIBILITY.md.
#
#   python3 tools/fetch_datasets.py --only release    # the frozen sources
#   docker compose up -d
#   python3 framework/load_all_domains.py             # source -> both databases
#   python3 tools/verify_gold_queries.py              # assert 50/50 gold queries
#
# The engine is PrestoDB 0.284 — the product the patent names, not Trino. CI uses
# the same image, so a green badge means the same thing as a local run.
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework_data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framework -d framework_data"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bcdr_framework
      MARIADB_USER: framework
      MARIADB_PASSWORD: framework
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # PRESTO_HOME in this image is /opt/presto-server, and the 0.284 image ships no
  # usable etc/ -- only config.properties.example and jvm.config.example, plus a
  # node.properties with no node.id. It fails with "Config file is missing:
  # /opt/presto-server/etc/config.properties". So supply the whole etc/ tree,
  # which is why framework/presto/etc/ holds all four files rather than only the
  # catalog: config.properties, jvm.config, node.properties, catalog/.
  #
  # The catalog defines the two connectors every query in the benchmark
  # references:  postgresql.public.<table>  JOIN  mysql.bcdr_framework.<table>
  #
  # The mount is deliberately WRITABLE. The image's entrypoint runs
  #   echo "node.id=$HOSTNAME" >> $PRESTO_HOME/etc/node.properties
  # before starting the launcher, so a read-only mount fails with
  # "/opt/entrypoint.sh: line 4: .../node.properties: Read-only file system".
  # Nothing secret is exposed: the catalog properties point at the other two
  # containers on this private compose network.
  presto:
    image: prestodb/presto:0.284
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb: {condition: service_healthy}
    volumes:
      - ./framework/presto/etc:/opt/presto-server/etc
    healthcheck:
      # curl is not installed in the image; python3 is, so probe with that.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/v1/info', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s
